# ============================================================
# Google Cloud Build — CI/CD Pipeline for AIRM
# ============================================================
#
# Builds & deploys both the backend and frontend to Cloud Run.
#
# Required substitution variables (set in Cloud Build trigger):
#   _REGION             — GCP region, e.g. asia-south1
#   _PROJECT_ID         — GCP project ID
#   _BACKEND_SERVICE    — Cloud Run service name for backend, e.g. airm-backend
#   _FRONTEND_SERVICE   — Cloud Run service name for frontend, e.g. airm-frontend
#   _BACKEND_IMAGE      — Artifact Registry image, e.g. asia-south1-docker.pkg.dev/PROJECT/airm/backend
#   _FRONTEND_IMAGE     — Artifact Registry image, e.g. asia-south1-docker.pkg.dev/PROJECT/airm/frontend
#
# Secret env vars passed to the backend Cloud Run service at deploy time
# are stored in Secret Manager and referenced in the deploy step.
#
# ============================================================

substitutions:
  _REGION: us-central1
  _BACKEND_SERVICE: airm-backend
  _FRONTEND_SERVICE: airm-frontend
  _BACKEND_IMAGE: us-central1-docker.pkg.dev/lad-develop/cloud-run-source-deploy/airm-backend
  _FRONTEND_IMAGE: us-central1-docker.pkg.dev/lad-develop/cloud-run-source-deploy/airm-frontend

steps:
  # ─────────────────────────────────────────────
  # STEP 1: Build backend Docker image
  # ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - '--tag=${_BACKEND_IMAGE}:$BUILD_ID'
      - '--tag=${_BACKEND_IMAGE}:latest'
      - '--cache-from=${_BACKEND_IMAGE}:latest'
      - '--file=backend/Dockerfile'
      - 'backend'

  # ─────────────────────────────────────────────
  # STEP 2: Push backend image to Artifact Registry
  # ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - push
      - '--all-tags'
      - '${_BACKEND_IMAGE}'

  # ─────────────────────────────────────────────
  # STEP 3: Deploy backend to Cloud Run
  # ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_BACKEND_SERVICE}'
      - '--image=${_BACKEND_IMAGE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=60'
      - '--set-env-vars=NODE_ENV=production,JWT_SECRET=your-super-secret-jwt-key-here,GITLAB_TOKEN=${_GITLAB_TOKEN},GITLAB_URL=http://165.22.208.99,GITLAB_PROJECT_ID=2,EMAIL_FROM=noreply@pulse.techiemaya.com,EMAIL_REPLY_TO=admin@techiemaya.com,CORS_ORIGIN=https://airm-frontend-kunfx3bnvq-uc.a.run.app,APP_BASE_URL=https://airm-backend-kunfx3bnvq-uc.a.run.app,FRONTEND_URL=https://airm-frontend-kunfx3bnvq-uc.a.run.app,GITHUB_TOKEN=${_GITHUB_TOKEN},GITHUB_OWNER=techiemaya-admin,GITHUB_REPO=LAD-Frontend'
      - '--update-secrets=DATABASE_URL=database-url:latest'

  # ─────────────────────────────────────────────
  # STEP 4: Get backend URL for frontend build
  # ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-backend-url'
    waitFor: ['deploy-backend']
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        echo "Backend URL: $$BACKEND_URL"
        echo "$$BACKEND_URL" > /workspace/backend_url.txt

  # ─────────────────────────────────────────────
  # STEP 5: Build frontend Docker image
  #         Injects the live backend URL as VITE_API_BASE_URL
  # ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['get-backend-url']
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        docker build \
          --tag=${_FRONTEND_IMAGE}:$BUILD_ID \
          --tag=${_FRONTEND_IMAGE}:latest \
          --cache-from=${_FRONTEND_IMAGE}:latest \
          --build-arg VITE_API_BASE_URL="$$BACKEND_URL" \
          --file=frontend/Dockerfile \
          frontend

  # ─────────────────────────────────────────────
  # STEP 6: Push frontend image
  # ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - push
      - '--all-tags'
      - '${_FRONTEND_IMAGE}'

  # ─────────────────────────────────────────────
  # STEP 7: Deploy frontend to Cloud Run
  # ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_FRONTEND_SERVICE}'
      - '--image=${_FRONTEND_IMAGE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--memory=256Mi'
      - '--cpu=1'

images:
  - '${_BACKEND_IMAGE}:$BUILD_ID'
  - '${_BACKEND_IMAGE}:latest'
  - '${_FRONTEND_IMAGE}:$BUILD_ID'
  - '${_FRONTEND_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
